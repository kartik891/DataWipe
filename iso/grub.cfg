# DataWipe live image. The same file serves UEFI (Ubuntu's signed GRUB, Secure Boot) and BIOS.
set timeout=10
set default=0
serial --unit=0 --speed=115200
terminal_input console serial
terminal_output console serial

menuentry "DataWipe" --hotkey=d {
    linux /boot/vmlinuz quiet loglevel=3
    initrd /boot/initrd.gz
}
menuentry "DataWipe on the serial console (ttyS0, 115200) for headless servers" --hotkey=s {
    linux /boot/vmlinuz quiet loglevel=3 console=ttyS0,115200 datawipe.tty=ttyS0
    initrd /boot/initrd.gz
}
menuentry "DataWipe, safe graphics (nomodeset)" --hotkey=n {
    linux /boot/vmlinuz quiet loglevel=3 nomodeset
    initrd /boot/initrd.gz
}
